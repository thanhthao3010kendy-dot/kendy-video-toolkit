<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"anhLaBai","type":"string","label":"Ảnh lá bài","default":"assets/la-bai.jpg"},{"id":"thuongHieu","type":"string","label":"Thương hiệu","default":"Kendy Huyền Học"},{"id":"loiMoi","type":"string","label":"Lời mời","default":"Theo dõi để nhận thông điệp tiếp theo"},{"id":"ghiChu","type":"string","label":"Ghi chú","default":"Thông điệp chung – chỉ mang tính tham khảo"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP lưu cục bộ (không phụ thuộc mạng khi dựng) -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/CormorantGaramond-SemiBold.ttf"); font-weight: 600; }
      :root {
        --ground: #062A2F;
        --gold: #D8BE8C;
        --ink: #F6EFE0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        width: 100%; height: 100%; position: relative;
        background: radial-gradient(ellipse at 50% 40%, #0F5C63 0%, var(--ground) 75%);
        font-family: "Be Vietnam Pro", sans-serif;
      }
      .center { position: absolute; left: 0; right: 0; text-align: center; }
      #card-wrap { position: absolute; left: 330px; top: 420px; width: 420px; height: 725px; }
      #card { width: 100%; height: 100%; border-radius: 22px; object-fit: cover;
              box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 50px rgba(216,190,140,.25); }
      #ring { position: absolute; left: 240px; top: 330px; width: 600px; height: 905px; border-radius: 40px;
              border: 2px solid var(--gold); }
      #brand { top: 1270px; font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 96px;
               color: var(--gold); letter-spacing: 4px; }
      #cta { top: 1410px; font-size: 46px; font-weight: 500; color: var(--ink); }
      #note { top: 1490px; font-size: 34px; font-weight: 500; color: var(--ink); opacity: .75; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="ring-host" class="clip" data-start="0" data-duration="4" data-track-index="0"><div id="ring"></div></div>
      <div id="card-host" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="card-wrap"><img id="card" src="assets/la-bai.jpg" alt="" data-var-src="anhLaBai" /></div>
      </div>
      <div id="brand-host" class="clip" data-start="0" data-duration="4" data-track-index="2">
        <div id="brand" class="center" data-var-text="thuongHieu">Kendy Huyền Học</div>
      </div>
      <div id="cta-host" class="clip" data-start="0" data-duration="4" data-track-index="3">
        <div id="cta" class="center" data-var-text="loiMoi">Theo dõi để nhận thông điệp tiếp theo</div>
        <div id="note" class="center" data-var-text="ghiChu">Thông điệp chung – chỉ mang tính tham khảo</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Hiệu ứng vừa phải: hiện dần, trượt nhẹ, khung vàng "thở" chậm
      tl.fromTo("#ring", { opacity: 0.3, scale: 0.96 }, { opacity: 0.55, scale: 1, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#card-wrap", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.1);
      tl.fromTo("#brand", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.6);
      tl.fromTo("#cta", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.0);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 0.75, duration: 0.6, ease: "power1.out" }, 1.3);
      tl.to("#ring", { scale: 1.015, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.9);
      tl.to(["#card-wrap", "#brand", "#cta", "#note", "#ring"], { opacity: 0, duration: 0.35, ease: "power1.in" }, 3.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
